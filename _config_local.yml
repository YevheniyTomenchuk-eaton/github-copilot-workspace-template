remote_theme: null
theme: just-the-docs
plugins:
  - jekyll-relative-links
  - jekyll-include-cache

search_enabled: false

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .github/
  - .vscode/
  - Gemfile
  - Gemfile.lock
  - Gemfile.local
  - Gemfile.local.lock
  - _config_local.yml
  - LICENSE
  - .gitignore
  - .gitattributes
  - .tools/
  - "*.sh"
  - "*.ps1"

  # Toolkit — generated Office documents (gitignored; category READMEs stay published)
  - toolkit/email/*.eml
  - toolkit/presentation/*.pptx
  - toolkit/excel/*.xlsx
  - toolkit/word/*.docx
  - toolkit/email/*/
  - toolkit/presentation/*/
  - toolkit/excel/*/
  - toolkit/word/*/

  # Reference material for AI analysis — gitignored, never published
  - sources/
